<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width">
  <title>nibble 検証フォーム</title>
  <style>
    body { font: 20px system-ui; margin: 24px; }
    textarea { font: 20px system-ui; width: 100%; height: 200px; }
    button { font: 20px system-ui; min-height: 44px; }
    p { overflow-wrap: anywhere; font-size: 14px; }
  </style>
</head>
<body>
  <h1>検証用フォーム</h1>
  <label for="destination">ペースト先</label>
  <textarea id="destination" aria-label="ペースト先"></textarea>
  <button onclick="showBytes()">本文のUTF-8を表示</button>
  <p id="result"></p>
  <a href="nibble-probe://list">研究用アプリへ戻る</a>
  <script>
    function showBytes() {
      const bytes = new TextEncoder().encode(document.getElementById("destination").value);
      document.getElementById("result").textContent = JSON.stringify(Array.from(bytes));
    }
  </script>
</body>
</html>

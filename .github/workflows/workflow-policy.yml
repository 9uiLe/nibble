name: Workflow policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: workflow-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false
      - name: Check repository with locked tools
        run: nix flake check --no-update-lock-file --print-build-logs
      - name: Check pull request body and commit inventory
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: nix develop --command python3 scripts/check_pr.py remote --event "$GITHUB_EVENT_PATH" --complete
